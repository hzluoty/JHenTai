[package]
name = "jhentai"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jhentai"
crate-type = ["cdylib", "rlib"]

[dependencies]
jhentai-core = { path = "../core" }
jhentai-platform = { path = "../platform" }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "image-default-formats"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "image-default-formats"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "image-default-formats"] }
pollster = "0.4"

[build-dependencies]
slint-build = "1.18.1"
